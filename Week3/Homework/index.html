<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <link href="StyleIG.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Isometra&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <h1>Week 3 Image Gallery</h1>
        <div class="controls">
            <button id="pauseButton">Pause</button>
            <button id="playButton">Play</button>
        </div>
    </header>

    <main class="gallery"> 
        <div class="thumbnails">
            <img id="image1" class="thumbnail" src="ImagesIG/Factory001.JPG" alt="Factory#001">
            <img id="image2" class="thumbnail" src="ImagesIG/Factory002.JPG" alt="Factory#002">
            <img id="image3" class="thumbnail" src="ImagesIG/Factort004.JPG" alt="Factort#004">
            <img id="image4" class="thumbnail" src="ImagesIG/Factory006.JPG" alt="Factory#006">
        </div>
        <div class="main-image-container">
            <img id="mainImage" class="main-image" src="ImagesIG/Factory001.JPG" alt="Factory#001">
        </div>
    </main>

    <script src="ScriptIG.js"></script>

</body>
</html>
